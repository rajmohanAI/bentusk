[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
hilt = "2.57.2"
coroutines = "1.10.2"
serialization = "1.9.0"
composeBom = "2025.07.00"
materialIconsExtended = "1.7.8"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
